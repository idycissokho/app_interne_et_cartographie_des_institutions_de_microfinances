# =============================================================================
# docker/nginx/nginx.conf
# Configuration Nginx pour l'environnement de développement.
#
# Rôle :
#   - Sert les fichiers statiques Django directement (sans passer par Gunicorn)
#   - Sert les fichiers médias uploadés directement
#   - Redirige toutes les autres requêtes vers Gunicorn (backend Django)
#
# En production, ce fichier sera complété avec SSL/TLS (HTTPS).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format de log structuré pour faciliter le débogage
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Taille maximale des fichiers uploadés (justificatifs de mandats)
    client_max_body_size 10M;

    server {
        listen 80;
        server_name localhost;

        # ------------------------------------------------------------------
        # Fichiers statiques Django (CSS, JS, admin)
        # Servis directement par Nginx sans passer par Gunicorn.
        # ------------------------------------------------------------------
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------------------------------------------
        # Fichiers médias uploadés (documents justificatifs des dirigeants)
        # ------------------------------------------------------------------
        location /media/ {
            alias /var/www/media/;
            expires 7d;
        }

        # ------------------------------------------------------------------
        # API Django — toutes les autres requêtes vers Gunicorn
        # Le nom "backend" correspond au nom du service dans docker-compose.yml
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://backend:8000;

            # En-têtes nécessaires pour que Django reçoive les bonnes infos
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout pour les requêtes longues (import Excel/CSV)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
