<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composant — Barre latérale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Navigation principale" style="width: 100%; height: 100%; min-height: 900px; box-sizing: border-box; background: #0B1424; color: #DCE2EC; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px 10px">
    <div style="width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #E9D49A, #C9A44C); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1424" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></div>
    <div><div style="font-weight: 800; font-size: 17px; color: #F4EFE3">Carto IMF</div><div style="font-size: 11px; color: #8E99AB">DRS-SFD</div></div>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6F7C91; padding: 14px 12px 6px 12px">{{g.title}}</div>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
      <a href="{{it.href}}" style="{{it.style}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
        <span style="flex: 1">{{it.label}}</span>
        <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 800; color: #0B1424; background: #F3D98C; border-radius: 999px; padding: 2px 8px">{{it.badge}}</span></sc-if>
      </a>
    </sc-for>
  </sc-for>
  <div style="margin-top: auto; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #C9A44C; color: #0B1424; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{initials}}</div>
    <div style="min-width: 0; flex: 1"><div style="font-weight: 700; font-size: 14px; color: #F4EFE3">[Prénom Nom]</div><div style="font-size: 12px; color: #F3D98C">{{roleLabel}}</div></div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E99AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","micro","macro","imf","points","dirigeants","supervision","consultation","import","audit"],"default":"dashboard"},"role":{"editor":"enum","options":["superviseur","consultant","admin"],"default":"superviseur"},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'dashboard';
    var role = this.props.role ?? 'superviseur';
    var I = {
      dashboard: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      micro: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5',
      macro: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      imf: 'M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6',
      points: 'M6 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M18 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M9 15.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M8 7.5h8M7 8.5l1.5 7M16.5 10l-6 6.5',
      dirigeants: 'M9 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 1 0 0-7M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.5 3.6 5.2',
      supervision: 'M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3zM9 12l2 2 4-4',
      consultation: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 1 0 0-6',
      import: 'M12 3v12M7 10l5 5 5-5M4 21h16',
      audit: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'
    };
    var mk = function (k, label, href, badge) {
      var on = k === active;
      return { label: label, href: href, icon: I[k], hasBadge: !!badge, badge: badge || '',
        style: 'display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; font-size: 14px; text-decoration: none; ' +
          (on ? 'background: rgba(201,164,76,.16); color: #F3D98C; font-weight: 700; box-shadow: inset 3px 0 0 #C9A44C;' : 'color: #DCE2EC; font-weight: 600;') };
    };
    var groups = [
      { title: 'Pilotage', items: [
        mk('dashboard', 'Tableau de bord', 'Tableau.dc.html'),
        role === 'consultant' ? mk('consultation', 'Espace consultation', 'Consultation.dc.html') : mk('supervision', 'Espace supervision', 'Supervision.dc.html', '5'),
        mk('micro', 'Carte micro', 'CarteMicro.dc.html'),
        mk('macro', 'Carte macro', 'CarteMacro.dc.html') ] },
      { title: 'Référentiels', items: [
        mk('imf', 'Institutions (IMF)', role === 'consultant' ? 'Consultation.dc.html' : 'Institutions.dc.html'),
        mk('points', 'Points de service', 'PointsService.dc.html'),
        mk('dirigeants', 'Dirigeants & mandats', 'Dirigeants.dc.html') ] }
    ];
    if (role !== 'consultant') groups.push({ title: 'Données', items: [ mk('import', 'Import / Export', 'ImportExport.dc.html'), mk('audit', "Journal d'audit", '#') ] });
    var RL = { superviseur: 'Superviseur', consultant: 'Consultation', admin: 'Administrateur' };
    return { groups: groups, roleLabel: RL[role], initials: role === 'consultant' ? 'CO' : (role === 'admin' ? 'AD' : 'SU') };
  }
}
</script>
</body>
</html>
