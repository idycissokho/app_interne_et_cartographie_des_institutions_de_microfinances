# =============================================================================
# infra/docker/nginx/nginx.prod.conf — PRODUCTION (serveur intranet)
#
# Seul point d'entrée de l'application :
#   - port 80  : redirection permanente vers HTTPS ;
#   - port 443 : HTTPS (certificat dans infra/docker/nginx/certs/ : fullchain.pem + privkey.pem),
#                /api/ et /admin/ → Django (Gunicorn), /media/justificatifs/ → fichiers déposés,
#                le reste → application React (conteneur frontend).
# HTTPS est indispensable : le navigateur ne donne la position GPS (section Itinéraire)
# que sur une adresse sécurisée, et Django refuse les connexions non sécurisées en production.
# Les fichiers statiques de Django (admin) sont servis par Django lui-même (WhiteNoise).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Imports Excel (5 Mo au plus) et justificatifs.
    client_max_body_size 10M;

    # DNS interne de Docker, interrogé à chaque requête (valid=10s) : si le backend est recréé
    # avec une autre adresse IP, Nginx la suit au lieu de répondre 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $host $backend_amont  { default http://backend:8000; }
    map $host $frontend_amont { default http://frontend:80; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- API et administration Django ---------------------------------
        location ~ ^/(api|admin|static)/ {
            proxy_pass $backend_amont;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # --- Justificatifs des mandats (liens des fiches dirigeants) ---------
        location /media/justificatifs/ {
            alias /var/www/media/justificatifs/;
            expires 1d;
        }
        # Les fichiers importés (annuaire complet) ne sont jamais servis.
        location /media/ { return 404; }

        # --- Application React ---------------------------------------------
        location / {
            proxy_pass $frontend_amont;
            proxy_set_header Host $host;
        }
    }
}
