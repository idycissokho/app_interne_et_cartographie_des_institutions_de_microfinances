# =============================================================================
# docker/nginx/nginx.conf
# Configuration Nginx pour l'environnement de développement.
#
# Rôle (http://localhost) :
#   - Sert les fichiers statiques Django et les médias déposés directement
#   - /api/ et /admin/ → backend Django ; le reste → serveur Vite du frontend
#
# En production (intranet) : infra/docker/nginx/nginx.prod.conf (HTTPS).
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format de log structuré pour faciliter le débogage
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Taille maximale des fichiers uploadés (justificatifs de mandats)
    client_max_body_size 10M;

    server {
        listen 80;
        server_name localhost;

        # ------------------------------------------------------------------
        # Fichiers statiques Django (CSS, JS, admin)
        # Servis directement par Nginx sans passer par Gunicorn.
        # ------------------------------------------------------------------
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------------------------------------------
        # Fichiers médias uploadés (documents justificatifs des dirigeants)
        # ------------------------------------------------------------------
        location /media/ {
            alias /var/www/media/;
            expires 7d;
        }

        # ------------------------------------------------------------------
        # API Django — proxy vers Gunicorn
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ------------------------------------------------------------------
        # Admin Django
        # ------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # Frontend React — serveur Vite du conteneur frontend (port 5173).
        # (En production : nginx.prod.conf, fichiers compilés servis sur le port 80.)
        # En-têtes Upgrade : rechargement à chaud de Vite (WebSocket).
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
