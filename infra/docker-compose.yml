# =============================================================================
# docker-compose.yml
# Orchestration des services pour l'environnement de développement local.
#
# Services :
#   - db       : PostgreSQL 16 avec extension PostGIS (données géospatiales)
#   - backend  : Django 5.2 via Gunicorn (API REST)
#   - nginx    : Reverse proxy HTTP (développement)
#   - frontend : React + Vite (http://localhost:5173)
#   - newrelic-infra : agent d'infrastructure New Relic (optionnel, profil « apm »)
#
# Usage (depuis la racine du projet) :
#   docker compose -f infra/docker-compose.yml up --build       # Premier démarrage
#   docker compose -f infra/docker-compose.yml up -d            # Démarrage en arrière-plan
#   docker compose -f infra/docker-compose.yml down             # Arrêt et suppression des conteneurs
#   docker compose -f infra/docker-compose.yml logs -f backend  # Suivi des logs du backend
# =============================================================================

# Nom de projet fixe : sans lui, Compose prendrait le nom du dossier (« infra ») et
# créerait de nouveaux volumes vides au lieu de réutiliser la base existante.
name: app_interne_et_cartographie_des_institutions_de_microfinances

# Les variables viennent de config/.env, chargé par « env_file » dans chaque service.
# Ce fichier n'utilise donc pas ${VAR} pour elles : Compose ne résout ${VAR} qu'à
# partir d'un .env placé à côté de ce fichier, pas depuis config/.env.

services:

  # ---------------------------------------------------------------------------
  # Base de données PostgreSQL 16 + PostGIS
  # Image officielle postgis/postgis qui inclut PostgreSQL + l'extension PostGIS
  # préinstallée, évitant une configuration manuelle de l'extension.
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: cartographie_imf_db

    env_file:
      - ../config/.env

    # L'image attend POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD : on les déduit
    # des variables DB_* de config/.env avant de lancer l'entrée normale de l'image.
    # ($$ = variable lue dans le conteneur, et non par Compose.)
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_DB="$$DB_NAME" POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD";
        exec docker-entrypoint.sh postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      # Expose PostgreSQL sur le port 5432 de la machine hôte pour permettre
      # la connexion depuis un client SQL (DBeaver, pgAdmin, etc.).
      - "5432:5432"

    healthcheck:
      # Vérifie que PostgreSQL accepte les connexions avant de démarrer le backend.
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - imf_network

  # ---------------------------------------------------------------------------
  # Backend Django — API REST
  # Construit depuis le Dockerfile du dossier backend/.
  # Démarre uniquement après que la base de données soit prête (healthcheck).
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cartographie_imf_backend

    env_file:
      - ../config/.env

    environment:
      # Ces valeurs complètent ou remplacent celles de config/.env (secrets, base, etc.).
      DJANGO_SETTINGS_MODULE: config.settings.development
      # À l'intérieur du réseau Docker, le service db est accessible par son nom.
      DB_HOST: db
      DB_PORT: 5432
      # --- APM New Relic (voir docs/APM.md) ---
      # NEW_RELIC_LICENSE_KEY (et NEW_RELIC_APP_NAME) se renseignent dans config/.env.
      # Sans clé, l'agent est désactivé et l'application tourne normalement.
      NEW_RELIC_ENVIRONMENT: development
      # Traçage distribué : suit une requête de bout en bout (vue -> SQL -> appels externes).
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      # Journal de l'agent dans les logs du conteneur (docker compose logs backend).
      NEW_RELIC_LOG: stdout
      NEW_RELIC_LOG_LEVEL: info

    volumes:
      - ../backend:/app
      - media_files:/app/mediafiles

    ports:
      # Expose Gunicorn sur le port 8000 de la machine hôte.
      - "8000:8000"

    depends_on:
      db:
        # Attend que le healthcheck de la base de données soit satisfait.
        condition: service_healthy

    restart: unless-stopped

    networks:
      - imf_network

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy
  # Sert les fichiers statiques et redirige les requêtes API vers Gunicorn.
  # En développement, simplifie l'accès à l'application sur le port 80.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cartographie_imf_nginx

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../backend/staticfiles:/var/www/static:ro
      - media_files:/var/www/media:ro

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - imf_network

  # ---------------------------------------------------------------------------
  # Frontend React (Vite) — http://localhost:5173
  # Le serveur Vite relaie /api et /media vers le backend (pas de CORS).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
    container_name: cartographie_imf_frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    # Le volume node_modules n'est rempli qu'à sa création : on resynchronise avec
    # package.json à chaque démarrage (sinon « Failed to resolve import » après l'ajout
    # d'une dépendance, ex. @fontsource/plus-jakarta-sans).
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - imf_network

  # ---------------------------------------------------------------------------
  # Agent d'infrastructure New Relic — CPU, mémoire, disque, réseau de la machine
  # et de chaque conteneur (db, backend, nginx, frontend).
  # Optionnel : ne démarre qu'avec le profil « apm » et une clé renseignée :
    # ---------------------------------------------------------------------------
  newrelic-infra:
    image: newrelic/infrastructure:latest
    container_name: cartographie_imf_newrelic_infra
    profiles: ["apm"]
    environment:
      # Seul service qui utilise ${VAR} : le lancer en indiquant le fichier .env :
      #   docker compose --env-file config/.env -f infra/docker-compose.yml --profile apm up -d
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NRIA_DISPLAY_NAME: cartographie-imf-dev
    # Accès en lecture à l'hôte et au démon Docker pour relever les métriques.
    cap_add:
      - SYS_PTRACE
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

# =============================================================================
# Volumes nommés — persistance des données entre les redémarrages
# =============================================================================
volumes:
  postgres_data:
    driver: local
  media_files:
    driver: local
  frontend_node_modules:
    driver: local

# =============================================================================
# Réseau interne — isolation des services
# =============================================================================
networks:
  imf_network:
    driver: bridge
