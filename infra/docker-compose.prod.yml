# =============================================================================
# infra/docker-compose.prod.yml — PRODUCTION sur le serveur intranet
#
# Fichier AUTONOME (ne pas le combiner avec docker-compose.yml, réservé au développement :
# une surcharge Compose garderait les montages du code source et les ports de développement).
# Guide complet : deploy/intranet/README.md
#
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# Services : db (PostgreSQL + PostGIS), backend (Django + Gunicorn), frontend (fichiers
# React compilés), nginx (seul point d'entrée : HTTPS 443, redirection 80 → 443),
# valhalla (facultatif, profil « itineraire » : calcul des trajets sans Internet).
# Variables : config/.env.production (modèle : deploy/intranet/env.production.example).
# =============================================================================

name: cartographie-imf

services:

  db:
    image: postgis/postgis:16-3.4
    env_file: ../config/.env.production
    # L'image attend POSTGRES_* : déduits des variables DB_* ($$ = lu dans le conteneur).
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_DB="$$DB_NAME" POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD";
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Aucun port publié : la base n'est joignable que par le backend, sur le réseau Docker.
    healthcheck:
      # Par TCP (-h 127.0.0.1) : au tout premier démarrage, le serveur temporaire d'initialisation
      # n'écoute que sur le socket local ; le backend n'attend ainsi que le vrai serveur.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: always
    networks: [imf]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    image: cartographie-imf-backend:prod
    env_file: ../config/.env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      DB_PORT: "5432"
      DATABASE_URL: ""            # l'intranet utilise les variables DB_*
      # Nginx termine le HTTPS et transmet X-Forwarded-Proto : Django sait que la requête était sécurisée.
      DJANGO_TRUST_X_FORWARDED_PROTO: "true"
    # Au démarrage (docker-entrypoint.sh) : migrations, régions et départements, compte administrateur.
    volumes:
      - media_files:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks: [imf]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    image: cartographie-imf-frontend:prod
    restart: always
    networks: [imf]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - media_files:/var/www/media:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on: [backend, frontend]
    restart: always
    networks: [imf]

  # Calcul d'itinéraires sur l'intranet (docs/itineraire.md) — facultatif :
  #   docker compose -f infra/docker-compose.prod.yml --profile itineraire up -d
  # puis ROUTING_URL=http://valhalla:8002 dans config/.env.production.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    profiles: ["itineraire"]
    environment:
      tile_urls: https://download.geofabrik.de/africa/senegal-and-gambia-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
    volumes:
      - valhalla_tiles:/custom_files
    restart: always
    networks: [imf]

volumes:
  postgres_data:
  media_files:
  valhalla_tiles:

networks:
  imf:
