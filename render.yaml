# =============================================================================
# render.yaml — Blueprint Render : backend Django de la DÉMONSTRATION en ligne
#
# Fichier propre à la démo (voir deploy/demo/README.md) : à supprimer le jour du
# passage à l'intranet. Il ne fait que décrire le service : l'image est
# backend/Dockerfile.prod, identique à celle de l'intranet.
#
# Les variables « sync: false » sont demandées par Render à la création du Blueprint
# (jamais écrites ici). DJANGO_SECRET_KEY est générée par Render.
# =============================================================================

services:
  - type: web
    name: cartographie-imf-api          # adresse : https://cartographie-imf-api.onrender.com
    runtime: docker
    plan: free
    region: frankfurt                   # même région que la base Neon (AWS eu-central-1)
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    autoDeploy: true
    envVars:
      # --- Secrets et adresses (saisis dans Render) ---
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: DATABASE_URL                # chaîne de connexion Neon (non poolée), avec ?sslmode=require
        sync: false
      - key: DJANGO_ALLOWED_HOSTS        # ex. cartographie-imf-api.onrender.com
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS # ex. https://cartographie-imf-api.onrender.com,https://<projet>.vercel.app
        sync: false
      - key: CORS_ALLOWED_ORIGINS        # ex. https://<projet>.vercel.app
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false

      # --- Réglages de la démo ---
      - key: DJANGO_TRUST_X_FORWARDED_PROTO   # Render termine le HTTPS et transmet X-Forwarded-Proto
        value: "true"
      - key: DJANGO_DONNEES_FICTIVES          # dirigeants importés aussitôt anonymisés
        value: "true"
      - key: DJANGO_SERVIR_MEDIAS             # true = justificatifs consultables SANS connexion : laisser false
        value: "false"
      - key: WEB_CONCURRENCY                  # un seul processus : 512 Mo de mémoire, cache cohérent
        value: "1"
      - key: ROUTING_URL                      # section « Itinéraire » : Valhalla public (FOSSGIS), usage modéré
        value: "https://valhalla1.openstreetmap.de"
