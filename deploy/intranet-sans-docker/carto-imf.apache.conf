# =============================================================================
# carto-imf.apache.conf — VirtualHost Apache de Carto IMF (installation sans Docker)
#
# Installé par l'ADMINISTRATEUR (guide, § j) dans /etc/apache2/sites-available/carto-imf.conf,
# puis : a2enmod proxy proxy_http headers ssl && a2ensite carto-imf && apache2ctl configtest
#        && systemctl reload apache2
#
# Site autonome sur le port 8443 : aucun fichier des autres sites (ports.conf, 000-default,
# default-ssl…) n'est modifié.
#
#   /                        → interface React compilée (/var/www/annuairedesimf/frontend),
#                              repli sur index.html pour les adresses de l'application (React Router)
#   /api/ /admin/ /static/   → Django (Gunicorn, 127.0.0.1:8000) ; /static/ = fichiers de
#                              l'administration, servis par WhiteNoise
#   /media/justificatifs/    → justificatifs des mandats (même règle que nginx.prod.conf)
#   /media/… (le reste)      → refusé : les fichiers importés (liste officielle) ne sont jamais servis
# =============================================================================

Listen 8443

<VirtualHost *:8443>
    ServerName  annuaireimf.drs-sfd.gouv.sn
    ServerAlias 10.233.225.2

    # --- Nom affiché ----------------------------------------------------------
    # Accès par l'adresse IP (ou tout autre nom) : renvoi vers le nom officiel, même page.
    # Le contrôle de santé de mettre-a-jour.sh (/api/v1/sante/) reste joignable par l'IP.
    # 302 (temporaire) : passer à 301 une fois le nom définitivement validé.
    # À n'activer qu'APRÈS la création du nom dans le DNS interne (sinon site injoignable).
    <If "tolower(%{HTTP_HOST}) !~ /^annuaireimf\.drs-sfd\.gouv\.sn(:8443)?$/ && %{REQUEST_URI} != '/api/v1/sante/'">
        Redirect 302 "https://annuaireimf.drs-sfd.gouv.sn:8443%{REQUEST_URI}"
    </If>

    # --- HTTPS --------------------------------------------------------------
    # Certificat d'essai de Debian en attendant celui de l'autorité interne (les navigateurs
    # afficheront un avertissement). Remplacer ces deux lignes, puis recharger Apache.
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    # --- Interface React ------------------------------------------------------
    DocumentRoot /var/www/annuairedesimf/frontend
    <Directory /var/www/annuairedesimf/frontend>
        Require all granted
        AllowOverride None
        Options -Indexes -FollowSymLinks
        # Adresse de l'application (/imf, /donnees…) sans fichier correspondant : index.html.
        FallbackResource /index.html
    </Directory>
    # Fichiers au nom versionné (assets/index-AbC123.js) : en cache un an.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # index.html jamais en cache : une mise à jour est prise en compte au prochain chargement.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    # --- Django (Gunicorn) ------------------------------------------------------
    ProxyRequests     Off
    ProxyPreserveHost On
    ProxyTimeout      120
    # Django sait ainsi que la requête d'origine était en HTTPS (DJANGO_TRUST_X_FORWARDED_PROTO=true).
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/    http://127.0.0.1:8000/api/
    ProxyPassReverse /api/    http://127.0.0.1:8000/api/
    ProxyPass        /admin/  http://127.0.0.1:8000/admin/
    ProxyPassReverse /admin/  http://127.0.0.1:8000/admin/
    ProxyPass        /static/ http://127.0.0.1:8000/static/
    ProxyPassReverse /static/ http://127.0.0.1:8000/static/

    # --- Fichiers déposés -------------------------------------------------------
    # Justificatifs des mandats : servis directement, comme dans nginx.prod.conf, donc SANS contrôle
    # de connexion (l'interface les ouvre par un simple lien) : quiconque connaît l'adresse exacte
    # d'un fichier peut l'ouvrir depuis l'intranet. Pas de liste des dossiers (-Indexes).
    Alias /media/justificatifs/ /var/www/annuairedesimf/media/justificatifs/
    <Directory /var/www/annuairedesimf/media/justificatifs>
        Require all granted
        AllowOverride None
        Options -Indexes -FollowSymLinks
        Header set X-Content-Type-Options nosniff
    </Directory>
    # Tout le reste de /media/ (fichiers importés : données réelles) : refusé.
    <LocationMatch "^/media/(?!justificatifs/)">
        Require all denied
    </LocationMatch>

    # Imports Excel (5 Mo au plus) et justificatifs : 10 Mo par requête.
    LimitRequestBody 10485760

    # --- En-têtes de sécurité --------------------------------------------------
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set Referrer-Policy strict-origin-when-cross-origin

    ErrorLog  ${APACHE_LOG_DIR}/carto-imf_error.log
    CustomLog ${APACHE_LOG_DIR}/carto-imf_access.log combined
</VirtualHost>
